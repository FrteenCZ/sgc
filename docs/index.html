<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover"
        />
        <title>Studentův průvodce kybernetikou</title>
        <meta
            name="description"
            content="Studentský Docsify rozcestník pro materiály, maturitní otázky a aktuální informace z kybernetiky."
        />
        <link
            id="theme-light"
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css"
        />
        <link
            id="theme-dark"
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css"
            disabled
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        />
        <style>
            /*Default color theme */
            :root {
                --theme-color: #0f766e;
                --theme-color-secondary: #ccfffb;
                --theme-color-hover: #115e59;
                --base-background-color: #f6f5ef;
                --base-color: #1b1d1f;
                --sidebar-background: linear-gradient(
                    180deg,
                    #e7f3ef 0%,
                    #f7f5ef 100%
                );
                --sidebar-name-color: #0f172a;
                --sidebar-nav-link-color: #25323d;
                --sidebar-nav-link-color--active: #0f766e;
                --sidebar-nav-link-background-color--active: rgba(
                    15,
                    118,
                    110,
                    0.1
                );
                --heading-color: #102a43;
                --link-color: #0f766e;
                --link-color-hover: var(--theme-color-hover);
                --bold-text-color: #7aa2f7;
                --italic-text-color: #7979f7;

                --blockquote-stripe-color: var(--theme-color);
                --blockquote-background-color: #ffffff;

                --code-text-color: var(--base-color);
                --code-background-color: #ffffff;
                --content-max-width: 58rem;
                --cover-background-image:
                    radial-gradient(
                        circle at top left,
                        rgba(15, 118, 110, 0.14),
                        transparent 34%
                    ),
                    radial-gradient(
                        circle at right,
                        rgba(180, 83, 9, 0.12),
                        transparent 28%
                    ),
                    linear-gradient(135deg, #f8f6ef 0%, #eef6f1 100%);
                --font-family: "Segoe UI", "Trebuchet MS", sans-serif;
                --heading-font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            }

            /*Dark theme*/
            html[data-theme="dark"] {
                --theme-color: #0fb6d6;
                --theme-color-secondary: #053943;
                --theme-color-hover: #0a748a;
                --base-background-color: #02171b;
                --base-color: #ffffff;
                --sidebar-background: linear-gradient(
                    180deg,
                    #071c1f 0%,
                    #02171b 100%
                );
                --sidebar-name-color: var(--base-color);
                --sidebar-nav-link-color: var(--base-color);
                --sidebar-nav-link-color--active: var(--base-color);
                --sidebar-nav-link-background-color--active: rgba(
                    94,
                    234,
                    212,
                    0.12
                );

                --heading-color: var(--theme-color);
                --link-color: var(--theme-color);
                --link-color-hover: var(--theme-color-hover);
                --bold-text-color: var(--theme-color);
                --italic-text-color: var(--theme-color);

                --blockquote-stripe-color: var(--theme-color);
                --blockquote-background-color: var(--theme-color-secondary);

                --code-text-color: var(--base-color);
                --code-background-color: var(--theme-color-secondary);

                --cover-background-image:
                    radial-gradient(
                        circle at top left,
                        rgba(45, 212, 191, 0.16),
                        transparent 34%
                    ),
                    radial-gradient(
                        circle at right,
                        rgba(251, 191, 36, 0.12),
                        transparent 28%
                    ),
                    linear-gradient(135deg, #10161b 0%, #132026 100%);
            }

            /*Dark mode images*/
            /* BLACKLIST: Invert ALL markdown images in dark mode UNLESS they have 'no-invert' */
            html[data-theme="dark"]
                .markdown-section
                img:not(.no-invert):not(.pre-inverted) {
                filter: invert(1) hue-rotate(180deg);
            }

            /* PRE-INVERTED: If an image is already dark, invert it ONLY in light mode */
            html[data-theme="light"] img.pre-inverted {
                filter: invert(1) hue-rotate(180deg);
            }

            /* Ensure images with these classes don't get double-filtered or messy */
            img.no-invert,
            html[data-theme="dark"] img.pre-inverted {
                filter: none !important;
            }

            .app-name-link img {
                display: none;
            }

            .markdown-section strong {
                color: var(--bold-text-color);
            }

            .markdown-section em {
                color: var(--italic-text-color);
            }

            .markdown-section code {
                /*Block code*/
                color: var(--code-text-color);
                background-color: var(--code-background-color);

                /*Inline code*/
                &:not([class*="lang-"]):not([class*="language-"]) {
                    color: var(--code-text-color);
                    background: var(--code-background-color);
                }
            }

            .markdown-section a {
                color: var(--link-color);
            }

            .markdown-section a:hover {
                color: var(--link-color-hover);
            }

            .markdown-section blockquote {
                border-left: 4px solid var(--blockquote-stripe-color);
                background: var(--blockquote-background-color);
            }

            .sidebar-nav > ul > li > a {
                font-weight: 600;
                letter-spacing: 0.01em;
            }

            #theme-toggle {
                position: fixed;
                bottom: 1rem;
                right: 1rem;
                z-index: 20;
                border: 1px solid rgba(15, 118, 110, 0.25);
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.82);
                color: #102a43;
                padding: 0.45rem 0.8rem;
                font:
                    600 0.85rem/1 "Segoe UI",
                    "Trebuchet MS",
                    sans-serif;
                backdrop-filter: blur(10px);
                cursor: pointer;
            }

            html[data-theme="dark"] #theme-toggle {
                background: rgba(15, 23, 32, 0.88);
                color: #e5edf3;
                border-color: rgba(94, 234, 212, 0.25);
            }

            @media (max-width: 768px) {
                #theme-toggle {
                    bottom: 0.75rem;
                    right: 0.75rem;
                    padding: 0.4rem 0.7rem;
                    font-size: 0.8rem;
                }
            }

            /* Keep only the Docsify-active sidebar branch expanded. */
            .sidebar-nav li > ul {
                display: none;
            }

            .sidebar-nav li.active > ul,
            .sidebar-nav li:has(> ul li.active) > ul {
                display: block;
            }

            /* Obsidian-like Callouts styling */
            .alert.callout {
                border-radius: 4px;
                margin: 1.5em 0;
                padding: 12px 16px;
                border-left-width: 4px;
                background-color: rgba(0, 0, 0, 0.03);
            }

            .alert.callout .alert-title {
                font-weight: 700;
                margin-bottom: 8px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .alert.callout p {
                margin: 0;
            }

            html[data-theme="dark"] .alert.callout {
                background-color: rgba(255, 255, 255, 0.05);
            }

            /* Specific colors for types to match Obsidian */
            .alert.callout.tip { border-left-color: #009688; }
            .alert.callout.tip .alert-title { color: #009688; }
            
            .alert.callout.note { border-left-color: #448aff; }
            .alert.callout.note .alert-title { color: #448aff; }

            .alert.callout.warning { border-left-color: #ff9100; }
            .alert.callout.warning .alert-title { color: #ff9100; }

            .alert.callout.danger { border-left-color: #ff5252; }
            .alert.callout.danger .alert-title { color: #ff5252; }

            .alert.callout.info { border-left-color: #00b0ff; }
            .alert.callout.info .alert-title { color: #00b0ff; }

            .alert.callout.success { border-left-color: #4caf50; }
            .alert.callout.success .alert-title { color: #4caf50; }

            .alert.callout.example { border-left-color: #7c4dff; }
            .alert.callout.example .alert-title { color: #7c4dff; }
        </style>
    </head>
    <body>
        <div id="app">Načítám studijní materiály...</div>
        <button
            id="theme-toggle"
            type="button"
            aria-label="Přepnout barevné schéma"
        >
            Tmavý režim
        </button>

        <script>
            function applyTheme(theme) {
                var root = document.documentElement;
                var lightTheme = document.getElementById("theme-light");
                var darkTheme = document.getElementById("theme-dark");
                var toggle = document.getElementById("theme-toggle");
                var isDark = theme === "dark";

                root.setAttribute("data-theme", theme);
                lightTheme.disabled = isDark;
                darkTheme.disabled = !isDark;

                if (toggle) {
                    toggle.textContent = isDark
                        ? "Světlý režim"
                        : "Tmavý režim";
                    toggle.setAttribute("aria-pressed", String(isDark));
                }
            }

            function getPreferredTheme() {
                var savedTheme = localStorage.getItem("sgc-theme");
                if (savedTheme === "light" || savedTheme === "dark") {
                    return savedTheme;
                }

                return window.matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light";
            }

            applyTheme(getPreferredTheme());

            document.addEventListener("DOMContentLoaded", function () {
                var toggle = document.getElementById("theme-toggle");
                if (!toggle) {
                    return;
                }

                toggle.addEventListener("click", function () {
                    var nextTheme =
                        document.documentElement.getAttribute("data-theme") ===
                        "dark"
                            ? "light"
                            : "dark";
                    localStorage.setItem("sgc-theme", nextTheme);
                    applyTheme(nextTheme);
                });
            });

            window.$docsify = {
                name: "Studentův průvodce kybernetikou",
                repo: "Kybernetika-SPSE/sgc",
                homepage: "README.md",
                loadSidebar: "_sidebar.md",
                auto2top: true,
                subMaxLevel: 2,
                maxLevel: 2,
                notFoundPage: "404.md",
                relativePath: true,
                search: {
                    placeholder: "Hledat v materiálech",
                    noData: "Nic jsem nenašel.",
                    paths: "auto",
                    depth: 3,
                    maxAge: 600,
                    namespace: "sgc-docs",
                },
                markdown: {
                    smartypants: true,
                    externalLinkTarget: "_blank",
                    linkify: true,
                },
                'flexible-alerts': {
                    style: 'callout',
                    note: {
                        label: 'Poznámka',
                        icon: 'fas fa-info-circle',
                        className: 'note'
                    },
                    tip: {
                        label: 'Tip',
                        icon: 'fas fa-lightbulb',
                        className: 'tip'
                    },
                    warning: {
                        label: 'Varování',
                        icon: 'fas fa-exclamation-triangle',
                        className: 'warning'
                    },
                    attention: {
                        label: 'Pozor',
                        icon: 'fas fa-exclamation-circle',
                        className: 'attention'
                    },
                    danger: {
                        label: 'Nebezpečí',
                        icon: 'fas fa-skull-crossbones',
                        className: 'danger'
                    },
                    info: {
                        label: 'Informace',
                        icon: 'fas fa-circle-info',
                        className: 'info'
                    },
                    success: {
                        label: 'Úspěch',
                        icon: 'fas fa-check-circle',
                        className: 'success'
                    },
                    example: {
                        label: 'Příklad',
                        icon: 'fas fa-list',
                        className: 'example'
                    },
                    quote: {
                        label: 'Citát',
                        icon: 'fas fa-quote-left',
                        className: 'quote'
                    }
                },
                plugins: [
                    function (hook, vm) {
                        var mathList = [];
                        hook.beforeEach(function (content) {
                            mathList = [];
                            // Convert \[ ... \] → $$ ... $$
                            content = content.replace(
                                /\\\[([\s\S]*?)\\\]/g,
                                function (_, inner) {
                                    return "$$" + inner + "$$";
                                },
                            );

                            // Protect all math blocks from markdown processing
                            // This prevents issues with _ or * inside math being interpreted as italics/bold
                            // 1. Protect $$ ... $$
                            content = content.replace(/\$\$[\s\S]*?\$\$/g, function(match) {
                                mathList.push(match);
                                return "@@MATH" + (mathList.length - 1) + "@@";
                            });

                            // 2. Protect \( ... \)
                            // Restrict to single line to prevent "sync" issues with unclosed delimiters
                            content = content.replace(/\\\([^\n]+?\\\)/g, function(match) {
                                mathList.push(match);
                                return "@@MATH" + (mathList.length - 1) + "@@";
                            });

                            // 3. Protect $ ... $ (inline math)
                            // Restrict to single line to prevent "sync" issues with unclosed delimiters
                            content = content.replace(/\$([^$\n]+?)\$/g, function(match) {
                                mathList.push(match);
                                return "@@MATH" + (mathList.length - 1) + "@@";
                            });

                            return content;
                        });

                        hook.afterEach(function (html, next) {
                            // Restore math blocks after markdown has finished
                            html = html.replace(/@@MATH(\d+)@@/g, function(match, index) {
                                return mathList[index];
                            });
                            next(html);
                        });
                    },
                ],
            };

            window.MathJax = {
                tex: {
                    inlineMath: [
                        ["$", "$"],
                        ["\\(", "\\)"],
                    ],
                    displayMath: [
                        ["$$", "$$"],
                        ["\\[", "\\]"],
                    ],
                },
                svg: {
                    fontCache: "global",
                },
                options: {
                    skipHtmlTags: [
                        "script",
                        "noscript",
                        "style",
                        "textarea",
                        "pre",
                        "code",
                    ],
                },
            };

            function docsifyMathJaxPlugin(hook) {
                hook.doneEach(function () {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise();
                    }
                });
            }

            window.$docsify.plugins = [].concat(
                docsifyMathJaxPlugin,
                window.$docsify.plugins || [],
            );
        </script>

        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
        <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-latex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markup.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
    </body>
</html>
